name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install pytest httpx pytest-asyncio
      - name: Run unit and architecture tests
        run: |
          pytest -q abilities/validation/tests/unit abilities/validation/tests/architecture

  integration:
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install pytest httpx pytest-asyncio testcontainers docker
      - name: Run integration tests
        run: |
          pytest -q abilities/validation/tests/integration
