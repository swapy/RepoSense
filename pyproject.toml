[build-system]
requires = ["uv", "uv-build"]
build-backend = "uv_build"

[project]
name = "repo-sense"
version = "0.1.0"
description = "Repo Sense prompt quality framework and validation tooling"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.24.0",
  "testcontainers>=4.0.0",
  "docker>=6.0.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/validation"]
python_files = ["test_*.py"]
addopts = "-q"
